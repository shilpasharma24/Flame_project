Fahrenheit to Celsius ML + Deep Learning + Web

<body>
<h1>Fahrenheit to Celsius Converter</h1>
<p>Machine Learning and Deep Learning Demo</p>
<label>Fahrenheit:</label>
<input type="number" id="fahrenheit">
<button onclick="convert()">Convert</button>
<h2 id="result"></h2>
<script>
function convert() {
let f =
document.getElementById(
"fahrenheit"
).value;
let c = (5 / 9) * (f - 32);
document.getElementById(
"result"
).innerHTML =
"Celsius: " + c.toFixed(2);
}
</script>
</body>
</html>
